server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        set $upstream http://expense-api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MEDIDO el 2026-10-16: con `IMAGENES_VISION_PRIMERO` una foto tarda
        # 7 a 9 MINUTOS en esta maquina (vision 3b con 4 CPUs: ~2300 tokens de
        # imagen que evaluar y ~900 tokens que generar). Con 300 s el POST /scan
        # moria en TODAS las corridas: nginx cortaba la conexion antes de que la
        # primera foto terminara, el front veia 504 y decia "no se pudo escanear"
        # con los tickets ya guardados.
        #
        # 1800 s es una red de seguridad, NO el mecanismo: una corrida larga
        # (8 fotos x 8 min) no cabe en ninguna peticion HTTP, y por eso el front
        # ya no depende de que el POST responda — sigue el progreso por
        # `GET /scan/runs` y avisa que la conexion se corto. Con esto, las
        # corridas de hasta media hora no muestran ni el aviso.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}