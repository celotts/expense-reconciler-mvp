[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --import-mode=importlib
; `importlib` y no el default `prepend`, y la razon es que hay DOS archivos de
; test llamados `test_reporte_cierre.py`: uno en `unit/` (A6, A7, A10) y otro en
; `integration/` (A1-A5, A8, A9). Los dos nombres los fija el contrato del
; producto (§5.3), asi que no se pueden renombrar.
;
; Con el modo `prepend` de python, dos modulos con el mismo nombre base colisionan
; —pytest importa el primero como `test_reporte_cierre` y el segundo da
; `import file mismatch`. Se podria resolver con `__init__.py` en cada carpeta,
; que es la solucion clasica, pero cambia el layout de todo el arbol de tests por
; un problema de un solo par de archivos.
;
; `importlib` resuelve el namespace por ruta de archivo en vez de por nombre de
; modulo, que es justo lo que necesitan dos archivos homonimos. Es la solucion
; que recomienda la propia documentacion de pytest para este caso.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning