# Cuotas de memoria: la VM de Docker en este equipo tiene 7.7GB asignados
# (host: 11 CPUs / 18GB RAM). El presupuesto total de abajo suma ~7.2GB, dejando
# aire para que el sistema no entre en swap. Si un servicio se pasa del limite,
# Docker lo mata (OOMKilled) en vez de congelar la laptop.
services:
  postgres-reconciler:
    image: pgvector/pgvector:pg16
    container_name: expense_pgvector
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CAMBIA_ESTA_PASSWORD
    ports:
      - "5434:5432"
    volumes:
      - pgvector_expense_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - expense_network

  ollama:
    image: ollama/ollama:latest
    container_name: expense_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # 4GB alcanzan para moondream (vision, ~2GB) y un modelo de texto <=4b.
    # Si carga un 7b, sube esto a 5g y baja expense-api a 1.5g.
    mem_limit: 4g
    mem_reservation: 512m
    cpus: 4.0
    restart: unless-stopped
    networks:
      - expense_network

  expense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_api_service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Cache de HuggingFace persistente: evita volver a bajar el modelo de
      # embeddings (~470MB) cada vez que se recrea el contenedor.
      - hf_cache:/opt/hf-cache
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:CAMBIA_ESTA_PASSWORD@postgres-reconciler:5432/expense_db
      - HF_HOME=/opt/hf-cache
    depends_on:
      postgres-reconciler:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # En reposo usa ~600MB; con el modelo de embeddings cargado ~1.4GB.
    mem_limit: 1750m
    mem_reservation: 512m
    cpus: 4.0
    restart: unless-stopped
    networks:
      - expense_network

  expense-front:
    build:
      context: .
      dockerfile: front/Dockerfile.prod
    container_name: expense_front_service
    ports:
      - "3000:80"
    depends_on:
      - expense-api
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - expense_network

volumes:
  pgvector_expense_data:
  ollama_data:
  hf_cache:


networks:
  expense_network:
    driver: bridge