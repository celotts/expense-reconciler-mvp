services:
  postgres-reconciler:
    image: pgvector/pgvector:pg16
    container_name: expense_pgvector
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fc100711
    ports:
      - "5434:5432"
    volumes:
      - pgvector_expense_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - expense_network

  # Ollama (Local LLM) - Opcional: descomenta si quieres correrlo en Docker
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: expense_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   networks:
  #     - expense_network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  expense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_api_service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:fc100711@postgres-reconciler:5432/expense_db
    depends_on:
      postgres-reconciler:
        condition: service_healthy
    networks:
      - expense_network

  expense-front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: expense_front_service
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - expense-api
    networks:
      - expense_network

volumes:
  pgvector_expense_data:
  # ollama_data:

networks:
  expense_network:
    driver: bridge