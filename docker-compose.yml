# Cuotas de memoria: la VM de Docker en este equipo tiene 7.7GB asignados
# (host: 11 CPUs / 18GB RAM). El presupuesto total de abajo suma ~7.2GB, dejando
# aire para que el sistema no entre en swap. Si un servicio se pasa del limite,
# Docker lo mata (OOMKilled) en vez de congelar la laptop.
services:
  postgres-reconciler:
    image: pgvector/pgvector:pg16
    container_name: expense_pgvector
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: postgres
      # La contraseña NO vive aquí. Este archivo estuvo versionado en un repo
      # publico con la contraseña escrita, y quitarla del archivo no la quita del
      # historial: la clave que hay que rotar es la del password, no la del YAML.
      # Sale de `.env` (gitignored). La plantilla es `.env.example`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no esta definida. Copia .env.example a .env y rellenala}
    ports:
      - "5434:5432"
    volumes:
      - pgvector_expense_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - expense_network

  ollama:
    image: ollama/ollama:latest
    container_name: expense_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # 4GB alcanzan para moondream (vision, ~2GB) y un modelo de texto <=4b.
    # Si carga un 7b, sube esto a 5g y baja expense-api a 1.5g.
    mem_limit: 4g
    mem_reservation: 512m
    cpus: 4.0
    restart: unless-stopped
    networks:
      - expense_network

  expense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_api_service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Cache de HuggingFace persistente: evita volver a bajar el modelo de
      # embeddings (~470MB) cada vez que se recrea el contenedor.
      - hf_cache:/opt/hf-cache
      # Carpeta de tickets del host, montada en SOLO LECTURA.
      #
      # `:ro` no es descuido: el escaner no borra ni escribe nada, y montarla de
      # lectura lo hace imposible aunque un bug lo intentara. Un comprobante
      # original que se borre porque el OCR salio mal es irreversible.
      #
      # La ruta del host va primero y la del contenedor despues, que es la que ve
      # la app. Por eso `TICKETS_INPUT_DIR` dentro del contenedor es `/tickets` y
      # no la ruta del host: montar `.:/app` y usar la ruta del host seria buscar
      # `/Users/...` dentro del contenedor, donde no existe.
      - ${TICKETS_HOST_DIR:-/Users/carloslott/Documents/Tickets_app}:/tickets:ro
    env_file:
      # El orden importa: con la misma variable en los dos archivos gana el
      # ULTIMO, asi que .env.local pisa a .env.dev. Es lo que permite tener
      # SECRET_KEY fuera del repo sin renombrar nada de lo que ya existe.
      #
      # `required: false` para que un clone nuevo, que no tiene .env.local, siga
      # levantando en vez de reventar con un error de "no such file". Sin el
      # secreto, config.py genera uno efimero y avisa: molesto (cada reinicio
      # cierra las sesiones) pero no roto, que es justo el criterio para no
      # impedir el arranque.
      - path: .env.dev
        required: true
      - path: .env.local
        required: false
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no esta definida. Copia .env.example a .env y rellenala}@postgres-reconciler:5432/expense_db
      - HF_HOME=/opt/hf-cache
      # Dentro del contenedor la carpeta SIEMPRE es /tickets. Se sobrescribe aqui
      # a proposito: el `.env.dev` del host tiene la ruta del host, que no existe
      # dentro del contenedor, y sin esto la app crearia `/Users/carloslott/...`
      # en el sistema de archivos del contenedor, como root.
      - TICKETS_INPUT_DIR=/tickets
    depends_on:
      postgres-reconciler:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # En reposo usa ~600MB; con el modelo de embeddings cargado ~1.4GB.
    mem_limit: 1750m
    mem_reservation: 512m
    cpus: 4.0
    restart: unless-stopped
    networks:
      - expense_network

  expense-front:
    build:
      context: .
      dockerfile: front/Dockerfile.prod
    container_name: expense_front_service
    ports:
      - "3000:80"
    depends_on:
      - expense-api
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - expense_network

volumes:
  pgvector_expense_data:
  ollama_data:
  hf_cache:


networks:
  expense_network:
    driver: bridge